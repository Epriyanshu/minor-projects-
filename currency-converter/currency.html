<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Conveter</title>
    <link rel="stylesheet" href="cnv.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css" integrity="sha384-NvKbDTEnL+A8F/AA5Tc5kmMLSJHUO868P+lDtTpJIeQdGYaUIuLr4lVGOEA1OcMy" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h2>Currency Converter </h2>
        <form action="">
            <div class="amount">
                <p>Enter Amount </p>
                <input type="text" id="amount" placeholder="Enter amount" min="0" step="0.01">
            </div>
            <div class="dropdown">
                <div name="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="us">
                        <select name="form" id="">
                         
                        </select>
                    </div>
                </div>
                
                <!-- <div class="exchange"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>  -->
                <div name ="To">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="us">
                        <select name="To" id="">
                          
                        </select>
                    </div>
                </div>
            </div>
            <div class="msg"> 1USD = 90INR</div>
            <button>Get exchange value</button>
        </form>
    </div>
    <script src="code.js"></script>
    <script src="cc.js"></script>
</body>

</html>
